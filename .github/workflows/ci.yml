name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taiga
          POSTGRES_PASSWORD: taiga
          POSTGRES_DB: taiga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taiga -d taiga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://taiga:taiga@localhost:5432/taiga
      CURRICULUM_SOURCE_DIR: ../design/taiga-42-v4.0-implementation-pack/curriculum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Backend migration
        working-directory: backend
        run: alembic upgrade head
      - name: Backend seed validation
        working-directory: backend
        run: |
          if [ -f ../../design/taiga-42-v4.0-implementation-pack/curriculum/weeks.json ]; then
            CURRICULUM_SOURCE_DIR=../../design/taiga-42-v4.0-implementation-pack/curriculum python -m taiga.seed
            CURRICULUM_SOURCE_DIR=../../design/taiga-42-v4.0-implementation-pack/curriculum python -m taiga.seed
          else
            echo "Design pack is not present in this checkout; local seed validation skipped."
          fi
      - name: Backend lint
        working-directory: backend
        run: ruff check .
      - name: Backend typecheck
        working-directory: backend
        run: mypy src tests
      - name: Backend test
        working-directory: backend
        run: pytest --cov=taiga --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend test
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend coverage
        working-directory: frontend
        run: npm run test:coverage -- --run

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Local MVP
        run: |
          if [ ! -f ../design/taiga-42-v4.0-implementation-pack/curriculum/weeks.json ]; then
            echo "Design pack is not present in this checkout; Playwright E2E skipped."
            echo "SKIP_E2E=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SKIP_E2E=false" >> "$GITHUB_ENV"
          docker compose up -d --build
          docker compose run --rm backend alembic upgrade head
          docker compose run --rm backend python -m taiga.seed
      - name: Playwright E2E
        if: env.SKIP_E2E != 'true'
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taiga
          POSTGRES_PASSWORD: taiga
          POSTGRES_DB: taiga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taiga -d taiga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://taiga:taiga@localhost:5432/taiga
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: OpenAPI validation
        working-directory: backend
        run: python -c "import json; from taiga.main import app; json.dumps(app.openapi())"
      - name: JSON Schema validation
        working-directory: backend
        run: python -m taiga.validation
      - name: Migration validation
        working-directory: backend
        run: alembic upgrade head
      - name: Docker Compose config validation
        run: docker compose config --quiet
      - name: Secret scanning
        run: |
          ! grep -RInE '(AWS_SECRET_ACCESS_KEY|BEGIN RSA PRIVATE KEY|gh[p]_|gh[o]_)' \
            --exclude-dir=.git --exclude='*.md' --exclude='ci.yml' .
