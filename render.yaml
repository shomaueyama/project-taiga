services:
  - type: web
    name: taiga-nova-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn taiga.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: APP_ENV
        value: production
      - key: LOCAL_AUTH_ENABLED
        value: "false"
      - key: RUNNER_ENABLED
        value: "false"
      - key: EXAM_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
