services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: taiga
      POSTGRES_DB: taiga
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiga -d taiga"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://taiga:taiga@postgres:5432/taiga}
      LOCAL_STORAGE_ROOT: /workspace/local-storage
    volumes:
      - ./local-storage:/workspace/local-storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "taiga.worker"]
    env_file:
      - .env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://taiga:taiga@postgres:5432/taiga}
      LOCAL_STORAGE_ROOT: /workspace/local-storage
    volumes:
      - ./local-storage:/workspace/local-storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  runner-controller:
    build:
      context: ./runner
    environment:
      RUNNER_ENABLED: ${RUNNER_ENABLED:-false}
    volumes:
      - ./local-storage:/workspace/local-storage:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
